name: Publish Quarto book

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter
          pip install .

      - name: Read version metadata
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import yaml

          with open("meta.yml") as f:
              metadata = yaml.safe_load(f)

          print(metadata["tag"])
          PY
          )

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check version matches Git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Version mismatch:"
            echo "  meta.yml: $VERSION"
            echo "  Git tag:     ${{ github.ref_name }}"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # HTML
      # -----------------------------------------------------------------------

      - name: Render HTML
        run: quarto render --to html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # PDF
      # -----------------------------------------------------------------------

      - name: Render PDF
        run: quarto render --to pdf

      - name: Rename PDF
        shell: bash
        run: |
          PDF=$(find _book -maxdepth 1 -name '*.pdf' -print -quit)

          if [ -z "$PDF" ]; then
            echo "Error: no PDF found in _book"
            exit 1
          fi

          OUTPUT="elementi-di-computazione-${VERSION}.pdf"
          mv "$PDF" "$OUTPUT"

          echo "PDF_FILE=$OUTPUT" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # GitHub release
      # -----------------------------------------------------------------------

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Upload PDF to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "$PDF_FILE" \
            --clobber