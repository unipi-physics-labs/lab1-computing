[project]
name = "computing-for-physics-lab"
version = "0.1.0"
description = "Code and examples for Computing for the Physics Laboratory"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88